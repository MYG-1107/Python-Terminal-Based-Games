<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Games Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --fg: #00ff9d;
            --accent: #ff00ff;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', system-ui;
            overflow-x: hidden;
        }
        header {
            background: #000;
            padding: 15px 20px;
            border-bottom: 4px solid var(--accent);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            color: var(--fg);
            text-shadow: 0 0 10px var(--fg);
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav button {
            background: #111;
            color: var(--fg);
            border: 2px solid var(--fg);
            padding: 10px 16px;
            font-family: 'Press Start 2P', cursive;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav button:hover, .nav button.active {
            background: var(--fg);
            color: #000;
        }
        .header-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }
        .game-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            display: none;
        }
        .game-container.active { display: block; }
        canvas {
            border: 6px solid var(--fg);
            box-shadow: 0 0 30px var(--accent);
            image-rendering: pixelated;
            background: #000;
        }
        .info-panel {
            background: #111;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid var(--fg);
            font-size: 15px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #000;
            border-top: 3px solid var(--fg);
            font-size: 13px;
        }
        .sweet-alert-score {
            font-family: 'Press Start 2P', cursive;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🕹️ TERMINAL ARCADE</div>
        
        <div class="nav">
            <button onclick="showGame(0)" class="active">2048</button>
            <button onclick="showGame(1)">Snake</button>
            <button onclick="showGame(2)">Tetris</button>
            <button onclick="showGame(3)">Sudoku</button>
            <button onclick="showGame(4)">Pac-Man</button>
            <button onclick="showGame(5)">Flappy Bird</button>
            <button onclick="showGame(6)">Tic-Tac-Toe</button>
        </div>

        <div class="header-info">
            <div id="currentTime"></div>
            <button onclick="getUserIP()" style="background:#222;color:var(--fg);border:2px solid var(--fg);padding:8px 14px;cursor:pointer;">
                Show IP Address
            </button>
            <a href="contact.html" style="color:var(--fg);text-decoration:none;border:2px solid var(--fg);padding:8px 14px;">
                Contact Developers
            </a>
        </div>
    </header>

    <!-- Games will be here (same as previous version with improvements) -->
    <div id="game-0" class="game-container active"> <!-- 2048 --> ... </div>
    <!-- Repeat for other games with improved UI -->

    <footer>
        &copy; 2026 Terminal Games Arcade • Developed by 
        <a href="https://www.linkedin.com/in/my2004/" style="color:var(--fg)">Mallarapu Yaswanth</a> & 
        <a href="https://www.linkedin.com/in/vishwatejapuppireddy/" style="color:var(--fg)">Puppireddy Vishwateja</a>
    </footer>

    <script>
        // Live Clock
        function updateTime() {
            const timeEl = document.getElementById('currentTime');
            setInterval(() => {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('en-US', { hour12: true });
            }, 1000);
        }

        // Get IP Address
        async function getUserIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                Swal.fire({
                    title: 'Your IP Address',
                    text: data.ip,
                    icon: 'info',
                    confirmButtonColor: '#00ff9d'
                });
            } catch(e) {
                Swal.fire('Error', 'Unable to fetch IP address', 'error');
            }
        }

        // Show Sweet Alert for High Score
        function showScoreAlert(gameName, score, bestScore) {
            let title = "Game Over!";
            let icon = "success";
            let message = `Your Score: <b>${score}</b>`;

            if (score > bestScore) {
                title = "🎉 NEW BEST SCORE!";
                message += `<br><span style="color:#ffd700">New Record! Previous Best: ${bestScore}</span>`;
            } else {
                message += `<br>Best Score: ${bestScore}`;
            }

            Swal.fire({
                title: title,
                html: message,
                icon: icon,
                confirmButtonText: 'Play Again',
                confirmButtonColor: '#00ff9d',
                customClass: { popup: 'sweet-alert-score' }
            });
        }

        // Example usage in game over:
        // showScoreAlert("Snake", currentScore, localStorage.getItem('snakeBest') || 0);

        // Initialize
        window.onload = () => {
            updateTime();
            // Initialize first game (2048 etc.)
            console.log("%cTerminal Games Arcade v2.0 Loaded Successfully!", "color:#00ff9d;font-family:monospace");
        };
    </script>
</body>
</html>
